<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MediGuide — Android User Guide Cover</title>
  <style>
    :root {
      color-scheme: light;
      --green: #183b31;
      --leaf: #347452;
      --muted: #73847c;
      --pale: #eaf2ec;
      --paper: #fff;
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      padding: 32px;
      display: grid;
      place-items: center;
      background: #eef2ef;
      color: var(--green);
      font-family: Aptos, "Segoe UI", Arial, sans-serif;
    }

    .cover {
      width: min(100%, 794px);
      min-height: 1123px;
      padding: 68px 72px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      background: var(--paper);
      box-shadow: 0 12px 42px rgb(24 59 49 / 12%);
    }

    .topline {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--leaf);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .16em;
    }

    .mark {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 10px;
      background: var(--pale);
      color: var(--leaf);
      font-size: 23px;
      font-weight: 500;
      line-height: 1;
    }

    .rule {
      height: 1px;
      margin-top: 20px;
      background: #dce5df;
    }

    main { margin-top: auto; margin-bottom: auto; padding: 84px 0 74px; }

    .eyebrow {
      margin: 0 0 20px;
      color: var(--leaf);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 570px;
      margin: 0;
      color: var(--green);
      font-size: clamp(56px, 9vw, 82px);
      font-weight: 650;
      letter-spacing: -.065em;
      line-height: .98;
    }

    .subtitle {
      max-width: 465px;
      margin: 26px 0 0;
      color: #53665c;
      font-size: 22px;
      line-height: 1.45;
    }

    .accent {
      width: 58px;
      height: 4px;
      margin: 38px 0;
      border-radius: 4px;
      background: var(--leaf);
    }

    .author-label {
      margin: 0 0 9px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .author {
      margin: 0;
      color: var(--green);
      font-size: 24px;
      font-weight: 650;
      letter-spacing: -.02em;
    }

    .roll {
      margin: 7px 0 0;
      color: var(--leaf);
      font-size: 15px;
    }

    .bottom {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      padding-top: 20px;
      border-top: 1px solid #dce5df;
      color: var(--muted);
      font-size: 11px;
    }

    .bottom strong {
      color: var(--green);
      font-size: 12px;
      letter-spacing: .08em;
    }

    @media (max-width: 600px) {
      body { padding: 0; background: var(--paper); }
      .cover { min-height: 100svh; padding: 38px 28px; box-shadow: none; }
      main { padding: 64px 0; }
      .subtitle { font-size: 19px; }
      .bottom { align-items: start; flex-direction: column; gap: 8px; }
    }

    @page { size: A4; margin: 0; }

    @media print {
      html, body { width: 210mm; height: 297mm; background: var(--paper); }
      body { padding: 0; display: block; }
      .cover {
        width: 210mm;
        height: 297mm;
        min-height: 0;
        padding: 18mm 19mm;
        box-shadow: none;
      }
      main { padding: 20mm 0; }
      h1 { font-size: 58pt; }
    }
  </style>
</head>
<body>
  <article class="cover" aria-label="MediGuide Android user guide cover">
    <header>
      <div class="topline">
        <span class="mark" aria-hidden="true">+</span>
        <span>MEDIGUIDE</span>
      </div>
      <div class="rule"></div>
    </header>

    <main>
      <p class="eyebrow">Android user guide</p>
      <h1>Your care,<br>made easier.</h1>
      <p class="subtitle">A friendly guide to using MediGuide on Android.</p>
      <div class="accent" aria-hidden="true"></div>
      <p class="author-label">Prepared by</p>
      <p class="author">Md. Sahariar Joy</p>
      <p class="roll">Roll No. 2403177</p>
    </main>

    <footer class="bottom">
      <strong>MEDIGUIDE</strong>
      <span>ANDROID USER GUIDE&nbsp; · &nbsp;VERSION 1.1.2</span>
    </footer>
  </article>
</body>
</html>
