databases:
  - name: mediguide-test-db
    databaseName: mediguide
    user: mediguide
    plan: free
    region: singapore

services:
  - type: web
    name: mediguide-test-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m backend.init_render_db && gunicorn -w 1 -k uvicorn.workers.UvicornWorker backend.main:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: mediguide-test-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
