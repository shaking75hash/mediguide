name: mediguide
description: "MediGuide Flutter healthcare app"
version: 1.0.4+4
publish_to: 'none'

environment:
  sdk: '^3.13.0'

dependencies:
  flutter:
    sdk: flutter

  # Existing functional dependencies
  http: ^1.6.0
  shared_preferences: ^2.5.5
  cupertino_icons: ^1.0.9

  # Premium UI dependencies
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  skeletonizer: 3.0.0
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true